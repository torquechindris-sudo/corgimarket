{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Set up {{ site_name }}</h1>
  <p class="muted">Create your admin account. You'll be the bank: you create markets, record deposits, pay out withdrawals and resolve bets.</p>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username <input name="username" required autofocus autocomplete="username"></label>
    <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primary">Create admin account</button>
  </form>
</div>
{% endblock %}
